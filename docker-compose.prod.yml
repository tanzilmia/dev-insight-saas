# DevInsight — production stack for a single VPS, everything in Docker.
#
# Database is external (Neon) — set DATABASE_URL in deploy/.env.prod. No app
# Postgres container is defined here by design.
#
# Usage (from the repo root):
#   cp deploy/env.prod.example deploy/.env.prod    # then fill it in
#   npm run prod:up            # core + sonar + openclaw, build + start
#   npm run prod:core          # just web + api + nginx
#   npm run prod:down
#   npm run prod:logs
#
# Or raw docker compose:
#   docker compose --env-file deploy/.env.prod -f docker-compose.prod.yml \
#     --profile sonar --profile openclaw up -d --build
#
# Profiles:
#   (none)    nginx, web, api   -> always start
#   sonar     sonarqube + its Postgres
#   openclaw  mcp + openclaw-gateway (AI chat)

name: devinsight-prod

services:
  # ---- Reverse proxy (nginx): single origin on :80, /api -> api, else -> web ----
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/devinsight-certs:/etc/nginx/certs:ro
    depends_on:
      - web
      - api

  # ---- Next.js dashboard (standalone) ----
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Empty => browser calls the API same-origin ("/api/..."), routed by nginx.
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-}"
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    depends_on:
      - api

  # ---- Express API (Prisma -> Neon). Runs `migrate deploy` on start. ----
  # IMPORTANT: single instance only. The scheduler + collection worker run
  # in-process with in-memory claim guards — do NOT scale this to >1 replica.
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    expose:
      - "4000"
    env_file:
      - deploy/.env.prod
    environment:
      NODE_ENV: production
      PORT: "4000"
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ---- Durable GitHub Actions retry worker ----
  # Uses the same image and database as the API, but claims retry jobs through
  # PostgreSQL leases so it can be scaled independently later.
  ci-retry-worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - deploy/.env.prod
    environment:
      NODE_ENV: production
    command: ["node", "dist/ci-retry-worker-main.js"]
    depends_on:
      api:
        condition: service_healthy

  # ---- OpenClaw AI chat bridge (our MCP server). Profile: openclaw ----
  mcp:
    profiles: ["openclaw"]
    build:
      context: ./integrations/devinsight-mcp-server
    restart: unless-stopped
    expose:
      - "4100"
    environment:
      DEVINSIGHT_URL: "http://api:4000"
      DEVINSIGHT_SERVICE_KEY: "${OPENCLAW_SERVICE_KEY:-}"
      MCP_ACCESS_TOKEN: "${MCP_ACCESS_TOKEN:-}"
      MCP_HOST: "0.0.0.0"
      PORT: "4100"
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://localhost:4100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      - api

  # ---- OpenClaw runtime/gateway (external software). Profile: openclaw ----
  # The gateway is private to this Compose network. nginx publishes only its
  # authenticated Chat Completions route at /openclaw; the Control UI and direct
  # port 18789 are intentionally not exposed on the VPS host.
  openclaw-gateway:
    profiles: ["openclaw"]
    image: "${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:latest}"
    restart: unless-stopped
    init: true
    expose:
      - "18789"
    env_file:
      - deploy/.env.prod
    environment:
      HOME: "/home/node"
      OPENCLAW_HOME: "/home/node"
      OPENCLAW_STATE_DIR: "/home/node/.openclaw"
      OPENCLAW_CONFIG_PATH: "/home/node/.openclaw/openclaw.json"
      OPENCLAW_CONFIG_DIR: "/home/node/.openclaw"
      OPENCLAW_WORKSPACE_DIR: "/home/node/.openclaw/workspace"
      OPENCLAW_GATEWAY_TOKEN: "${OPENCLAW_GATEWAY_TOKEN:-}"
      OPENCLAW_DISABLE_BONJOUR: "1"
    volumes:
      - ./deploy/openclaw:/home/node/.openclaw
    command:
      - "node"
      - "dist/index.js"
      - "gateway"
      - "--bind"
      - "lan"
      - "--port"
      - "18789"
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://127.0.0.1:18789/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      mcp:
        condition: service_healthy

  # One-off operator CLI sharing the gateway's persistent state. It is on a
  # separate profile so `--profile openclaw up` never starts an idle CLI
  # container. Explicit `docker compose run openclaw-cli ...` still works.
  openclaw-cli:
    profiles: ["openclaw-cli"]
    image: "${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:latest}"
    init: true
    stdin_open: true
    tty: true
    env_file:
      - deploy/.env.prod
    environment:
      HOME: "/home/node"
      OPENCLAW_HOME: "/home/node"
      OPENCLAW_STATE_DIR: "/home/node/.openclaw"
      OPENCLAW_CONFIG_PATH: "/home/node/.openclaw/openclaw.json"
      OPENCLAW_CONFIG_DIR: "/home/node/.openclaw"
      OPENCLAW_WORKSPACE_DIR: "/home/node/.openclaw/workspace"
      OPENCLAW_GATEWAY_TOKEN: "${OPENCLAW_GATEWAY_TOKEN:-}"
      OPENCLAW_DISABLE_BONJOUR: "1"
    volumes:
      - ./deploy/openclaw:/home/node/.openclaw
    entrypoint:
      - "node"
      - "dist/index.js"

  # ---- SonarQube Community Edition + its own Postgres. Profile: sonar ----
  sonar_db:
    profiles: ["sonar"]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: "${SONAR_DB_PASSWORD:-sonar}"
      POSTGRES_DB: sonar
    volumes:
      - sonar_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 5s
      timeout: 5s
      retries: 10

  sonarqube:
    profiles: ["sonar"]
    image: sonarqube:community
    restart: unless-stopped
    depends_on:
      sonar_db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar_db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: "${SONAR_DB_PASSWORD:-sonar}"
      # Serve under the /sonarqube subpath so nginx can reverse-proxy the UI on
      # the same origin as the app (https://<domain>/sonarqube). Without this,
      # SonarQube emits root-relative asset links (/js, /static) that collide with
      # the Next.js app and the UI renders blank. Internal + external + scanner
      # access all become /sonarqube/... (SONAR_BASE_URL / SONAR_PUBLIC_URL).
      SONAR_WEB_CONTEXT: "/sonarqube"
    ports:
      # Direct HTTP access on 9000 (kept for admin/debug). Public traffic should
      # use the HTTPS proxy at https://<domain>/sonarqube instead.
      - "0.0.0.0:9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

volumes:
  sonar_db_data: {}
  sonarqube_data: {}
  sonarqube_extensions: {}
  sonarqube_logs: {}
