# DevInsight CI — Phase 1 (development-focused, deterministic).
#
# Runs the same checks a developer runs locally, across the npm-workspace
# monorepo (apps/api + apps/web + packages/shared). No deployment, no Docker
# publication, no SonarQube, and no secrets — this is purely a correctness gate.
#
# Every command here maps to a real root package.json script. Reproduce the
# whole pipeline locally with:
#   npm ci && npm run prisma:generate && npm run typecheck && npm run lint && npm test && npm run build
#
# See docs/architecture/github-actions-ci.md for the design and the deferred
# customer-repository automation roadmap.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: the pipeline only needs to read the checked-out code.
permissions:
  contents: read

# One in-flight run per ref; a newer push cancels the older run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test & build
    runs-on: ubuntu-latest
    env:
      # Deterministic, offline-friendly Next.js build (no telemetry network calls).
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Matches the repo's engines.node ">=20"; resolves to the latest 20.x.
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Prisma 7 has no postinstall hook here, so the client is NOT generated by
      # `npm ci`. Typecheck/build import @prisma/client types and fail without it.
      # `prisma generate` only reads the schema (no DB connection, no secrets).
      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
