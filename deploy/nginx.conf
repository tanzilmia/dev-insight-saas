# DevInsight reverse proxy (nginx) — HTTPS single origin on the production domain.
#
#   /api/*   -> api:4000   (Express: REST, /api/webhooks/*, NDJSON chat stream)
#   /health  -> api:4000
#   /sonarqube -> sonarqube:9000 (public scanner/UI context)
#   restricted /openclaw -> openclaw-gateway:18789
#   /*       -> web:3000   (Next.js)
#
# Same-origin design: the web image is built with NEXT_PUBLIC_API_URL="" so the
# browser calls /api/... on this host; nothing here hard-codes the VPS IP.
#
# This file is mounted at /etc/nginx/conf.d/default.conf (see docker-compose.prod.yml),
# replacing the stock default server. Certificates are mounted read-only from
# /opt/devinsight-certs on the VPS; see docs/DEPLOYMENT.md.

# Public OpenClaw chat requests are authenticated by the gateway token. This
# per-client limit is an additional abuse guard; it does not replace auth.
limit_req_zone $binary_remote_addr zone=openclaw_chat:10m rate=30r/m;

# Production domain: devinside.softathena.com (HTTPS)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name devinside.softathena.com;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 25m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    location /api/ {
        set $upstream api:4000;
        proxy_pass http://$upstream$request_uri;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /health {
        set $upstream api:4000;
        proxy_pass http://$upstream$request_uri;
    }

    # Restricted OpenClaw public surface. Local DevInsight APIs can use
    # OPENCLAW_GATEWAY_URL=https://devinside.softathena.com/openclaw, while the
    # gateway itself and MCP bridge remain private to the Compose network.
    location = /openclaw/v1/chat/completions {
        limit_except POST { deny all; }
        limit_req zone=openclaw_chat burst=10 nodelay;

        set $upstream openclaw-gateway:18789;
        proxy_pass http://$upstream/v1/chat/completions;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /openclaw/healthz {
        set $upstream openclaw-gateway:18789;
        proxy_pass http://$upstream/healthz;
        proxy_buffering off;
        proxy_cache off;
    }

    # Do not publish the Control UI, WebSockets, configuration API, or future
    # gateway endpoints merely because they share the /openclaw prefix.
    location /openclaw {
        return 404;
    }

    # SonarQube (code quality) under sonar.web.context=/sonarqube. Exposed over
    # HTTPS so client repos' GitHub Actions runners push scan results securely
    # (SONAR_HOST_URL = https://<domain>/sonarqube). A prefix match (NO trailing
    # slash) covers both /sonarqube and /sonarqube/… and lets SonarQube own its
    # canonical redirect (it 308s /sonarqube/ → /sonarqube); a separate
    # `= /sonarqube → /sonarqube/` redirect here would form an infinite loop.
    # The prefix is preserved (not stripped) so asset links resolve.
    location /sonarqube {
        set $upstream sonarqube:9000;
        proxy_pass http://$upstream;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        set $upstream web:3000;
        proxy_pass http://$upstream$request_uri;
    }
}

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name devinside.softathena.com;
    return 301 https://$host$request_uri;
}

# Fallback: app.softathena.com (old subdomain, redirect to devinside)
server {
    listen 80;
    listen [::]:80;
    server_name app.softathena.com;
    return 301 https://devinside.softathena.com$request_uri;
}

# Fallback: localhost/IP access (backward compat)
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # GitHub webhooks / bulk imports can carry sizable bodies.
    client_max_body_size 25m;

    # Use Docker's embedded DNS so service names are re-resolved when a container
    # is recreated with a new IP (e.g. after `npm run prod:up` rebuilds the api).
    # Without this, nginx caches the startup IP and 502s after an update.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Shared proxy settings.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # API + webhooks -> Express. The /api prefix is preserved (routes live under it).
    location /api/ {
        set $upstream api:4000;
        proxy_pass http://$upstream$request_uri;

        # The chat endpoint streams NDJSON token-by-token — turn OFF buffering so
        # each chunk reaches the browser immediately (otherwise the assistant
        # reply appears only once, at the very end).
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Optional: expose the API health check at /health for quick curl checks.
    location = /health {
        set $upstream api:4000;
        proxy_pass http://$upstream$request_uri;
    }

    # SonarQube (code quality) under sonar.web.context=/sonarqube. Prefix match
    # (no trailing slash) covers /sonarqube and /sonarqube/…, prefix preserved,
    # SonarQube owns its canonical redirect — same as the HTTPS block above.
    location /sonarqube {
        set $upstream sonarqube:9000;
        proxy_pass http://$upstream;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Everything else -> the Next.js dashboard.
    location / {
        set $upstream web:3000;
        proxy_pass http://$upstream$request_uri;
    }
}
