# SonarQube scanner config for the DevInsight npm-workspace monorepo.
# Run with scripts/sonar-scan.sh (which passes the host URL + token).
#
# Community Edition analyzes the main branch only; each scan overwrites the
# project's view in SonarQube.

sonar.projectKey=devinsight
sonar.projectName=DevInsight
sonar.sourceEncoding=UTF-8

# --- Analyzed source (the three workspaces that hold hand-written code) ---
# packages/shared is a stub today but included so it's covered as it grows.
sonar.sources=apps/api/src,apps/web/src,packages/shared/src

# --- Test code (kept separate so it's not flagged as production issues) ---
# apps/api tests live OUTSIDE src (see CLAUDE.md / vitest.config.ts).
sonar.tests=apps/api/tests
sonar.test.inclusions=apps/api/tests/**/*.test.ts

# --- Excluded from analysis (generated, built, vendored, or type-only) ---
sonar.exclusions=**/node_modules/**,**/dist/**,**/.next/**,**/coverage/**,**/*.d.ts,apps/api/prisma/migrations/**,integrations/**

# --- Coverage (produced by `npm run test:coverage -w @devinsight/api`) ---
# Only apps/api has a test suite today; add more lcov paths (comma-separated)
# as other workspaces get tests.
sonar.javascript.lcov.reportPaths=apps/api/coverage/lcov.info
# Worker bootstrap only wires timers and has no business logic; keep it out of
# coverage thresholds while the retry service itself remains fully analyzed.
sonar.coverage.exclusions=apps/api/src/ci-retry-worker-main.ts

# --- TypeScript program config so the analyzer resolves types correctly ---
sonar.typescript.tsconfigPaths=apps/api/tsconfig.json,apps/web/tsconfig.json
